
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koło Fortuny</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    background: linear-gradient(135deg,#17002d,#502080);
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: gold;
    font-size: 36px;
}

.main {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 50px;
    margin-top: 35px;
}

.wheel-area {
    text-align: center;
    position: relative;
}

.wheel-box {
    position: relative;
    width: min(85vw, 420px);
    height: min(85vw, 420px);
}

canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 30px gold;
    cursor: pointer;
    touch-action: manipulation;
}

.pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    color: gold;
    z-index: 2;
    pointer-events: none;
}

button {
    border: none;
    border-radius: 25px;
    padding: 12px 20px;
    margin: 5px;
    cursor: pointer;
    font-weight: bold;
    background: gold;
    color: #260040;
}

button:hover {
    transform: scale(1.04);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.panel {
    width: 320px;
    max-width: 90vw;
    padding: 25px;
    background: #ffffff16;
    border: 1px solid #ffffff35;
    border-radius: 20px;
    box-shadow: 0 0 20px #0005;
}

.panel h2 {
    color: gold;
    text-align: center;
}

#result {
    min-height: 100px;
    padding: 20px;
    background: #17002d;
    border: 2px solid gold;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    color: gold;
    overflow-wrap: anywhere;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

#list {
    padding: 0;
    list-style: none;
}

#list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff18;
    padding: 8px;
    margin: 6px 0;
    border-radius: 8px;
    overflow-wrap: anywhere;
    gap: 8px;
}

#list button {
    background: #ff4545;
    color: white;
    padding: 7px 12px;
    flex-shrink: 0;
}

#spin {
    font-size: 20px;
    margin-top: 20px;
}

@media(max-width: 650px) {
    .main { gap: 30px; }
}
</style>
</head>

<body>

<h1>🎡 KOŁO FORTUNY 🎡</h1>

<div class="main">

    <div class="wheel-area">
        <div class="wheel-box">
            <div class="pointer">▼</div>
            <canvas id="wheel" width="600" height="600"></canvas>
        </div>

        <button id="spin">🎡 ZAKRĘĆ KOŁEM</button>
        <p>Kliknij również bezpośrednio w koło!</p>
    </div>

    <div class="panel">

        <h2>🏆 WYNIK LOSOWANIA</h2>

        <div id="result">
            Czekam na losowanie...
        </div>

        <h2>➕ Dodaj imię lub napis</h2>

        <input
            type="text"
            id="newName"
            placeholder="Wpisz imię lub napis..."
            maxlength="30"
        >

        <button id="add">DODAJ</button>

        <h2>📝 Lista na kole</h2>

        <ul id="list"></ul>

    </div>

</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spin");
const result = document.getElementById("result");
const input = document.getElementById("newName");
const list = document.getElementById("list");

let names = ["Maciej", "Janek", "Dominik", "Maya", "Iga"];

const colors = [
    "#ff3838", "#3478ff", "#21c779",
    "#b832e8", "#ff9d25", "#00a8a8",
    "#e84393", "#7656d6"
];

let rotation = 0;
let spinning = false;

function draw() {
    ctx.clearRect(0, 0, 600, 600);

    const slice = Math.PI * 2 / names.length;

    names.forEach((name, i) => {
        const start = rotation + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(300, 300);
        ctx.arc(300, 300, 285, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();
        ctx.translate(300, 300);
        ctx.rotate(start + slice / 2);

        ctx.fillStyle = "white";
        ctx.font = "bold 27px Arial";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        ctx.fillText(name, 260, 0, 230);

        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(300, 300, 35, 0, Math.PI * 2);
    ctx.fillStyle = "gold";
    ctx.fill();
}

function updateList() {
    list.innerHTML = "";

    names.forEach((name, index) => {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = name;

        const remove = document.createElement("button");
        remove.textContent = "X";

        remove.addEventListener("click", () => {
            if (spinning) return;

            names.splice(index, 1);
            draw();
            updateList();
        });

        li.appendChild(span);
        li.appendChild(remove);
        list.appendChild(li);
    });
}

function addName() {
    const value = input.value.trim();

    if (!value) return;
    if (spinning) return;

    names.push(value);
    input.value = "";

    draw();
    updateList();
}

document.getElementById("add").addEventListener("click", addName);

input.addEventListener("keydown", event => {
    if (event.key === "Enter") addName();
});

function spin() {
    if (spinning || names.length < 2) return;

    spinning = true;
    spinBtn.disabled = true;
    result.textContent = "Losowanie trwa... 🎲";

    const start = rotation;
    const distance = Math.PI * 2 * 8 + Math.random() * Math.PI * 2;
    const duration = 5000;
    const startTime = performance.now();

    function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 4);

        rotation = start + distance * ease;
        draw();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            rotation %= Math.PI * 2;

            const slice = Math.PI * 2 / names.length;
            const angle = (
                Math.PI * 1.5 - rotation + Math.PI * 2
            ) % (Math.PI * 2);

            const index = Math.floor(angle / slice);

            result.textContent = "🏆 " + names[index] + " 🎉";

            spinning = false;
            spinBtn.disabled = false;
        }
    }

    requestAnimationFrame(animate);
}

spinBtn.addEventListener("click", spin);
canvas.addEventListener("click", spin);

draw();
updateList();
</script>

</body>
</html>
